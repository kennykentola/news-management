<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="#0F172A"/>

  <!-- Shield gradient definition -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BFDBFE;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M50 12 L82 26 L82 52 C82 68 66 80 50 88 C34 80 18 68 18 52 L18 26 Z"
        fill="url(#shieldGrad)" />

  <!-- Letter N -->
  <text x="50" y="60"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-size="36"
        fill="url(#checkGrad)"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-1">N</text>

  <!-- Checkmark accent (small, bottom right of shield) -->
  <polyline points="38,63 45,72 63,50"
            fill="none"
            stroke="rgba(255,255,255,0.25)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"/>
</svg>
